name: test
on:
  push: {branches: [main]}
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable quickstatus-agent.sh install.sh uninstall.sh tests/*.sh
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, ubuntu:20.04, debian:12, alpine:3.20, rockylinux:9-minimal, amazonlinux:2023]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pip install jsonschema
      - run: tests/run.sh ${{ matrix.image }}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t quickstatus-agent:ci .
      - run: docker run --rm -e QUICKSTATUS_STATE_DIR=/tmp/s quickstatus-agent:ci version
